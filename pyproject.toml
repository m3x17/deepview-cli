[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepview-cli"
version = "0.1.0"
description = "Command-line tool to import, explore, and compare data with statistics-first distribution fitting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer", "pandas", "scipy", "rich"]

[project.scripts]
deepview = "deepview.cli:app"

[tool.setuptools.packages.find]
where = ["src"]